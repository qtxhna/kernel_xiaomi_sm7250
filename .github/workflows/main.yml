name: Build Driftwood Kernel (Matrix + ccache)

on:
  push:
    branches: [ "android-4.19" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    outputs:
      resukisu_ver: ${{ steps.calc_ver.outputs.resukisu_ver }}
    strategy:
      matrix:
        include:
          - ksu_status: "with-KSU"
            build_args: "all"
          - ksu_status: "no-KSU"
            build_args: "all noksu"

    name: Build (${{ matrix.ksu_status }})

    steps:
    # 1. 拉取内核源码
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1
    - name: Pull the complete history of submodules and convert to directory.
      id: calc_ver
      run: |
        git submodule update --init --recursive
        rm ReSukiSU/.git
        mv .git/modules/ReSukiSU ReSukiSU/.git

        # 使用 sed 直接修改文本，删除失效的 worktree 配置（绕过 git 本身的路径检查）
        sed -i '/worktree =/d' ReSukiSU/.git/config

        cd ReSukiSU
        echo "=== 验证子模块历史记录 ==="
        git log --oneline -n 5

        SUBMODULE_COUNT=$(git rev-list --count HEAD)
        VERSION_NUM=$((SUBMODULE_COUNT + 30700))
        echo "resukisu_ver=$VERSION_NUM" >> $GITHUB_OUTPUT
    # 2. 安装依赖
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
          make curl zip unzip libxml2-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          ccache

    # 3. 下载 AOSP Clang
    - name: Setup Specific Android Clang
      run: |
        echo "--------------------------------------------------"
        echo " Cloning Clang 14.0.6 (r450784d) from Android13..."
        echo "--------------------------------------------------"
        git clone --depth=1 -b android13-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/android-clang
        if [ ! -d "$GITHUB_WORKSPACE/android-clang/clang-r450784d" ]; then
          echo "Error: clang-r450784d not found in this branch!"
          exit 1
        fi

    # 4. 配置并恢复 ccache 缓存
    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        # 移除 key 尾部的 sha，让它直接匹配最新的一次缓存，进一步提高恢复成功率
        key: ${{ runner.os }}-ccache-${{ matrix.ksu_status }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ matrix.ksu_status }}-

    # 5. 创建 ccache 编译器伪装
    - name: Create ccache Masquerade
      run: |
        mkdir -p $GITHUB_WORKSPACE/ccache-bin
        ln -s /usr/bin/ccache $GITHUB_WORKSPACE/ccache-bin/clang
        echo "$GITHUB_WORKSPACE/android-clang/clang-r450784d/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/ccache-bin" >> $GITHUB_PATH

    # 6. 执行脚本编译（注入终极优化环境变量）
    - name: Build Kernel via Script
      env:
        KBUILD_BUILD_USER: qtxhna
        KBUILD_BUILD_HOST: github-actions
        CCACHE_DIR: "/home/runner/.ccache"
        CCACHE_MAXSIZE: "5G"
        
        # 【核心修复 1】将绝对路径重映射为相对路径，防止因路径导致缓存失效
        CCACHE_BASEDIR: ${{ github.workspace }}
        
        # 【核心修复 2】忽略源文件中的文件修改时间（mtime）差异，只关注代码内容本身
        CCACHE_COMPILERCHECK: "%compiler% -v"
        
        # 【核心修复 3】优化内核编译中的预处理行为
        CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime"
        
      run: |
        chmod +x build.sh
        
        # 清除旧统计
        ccache -z
        
        echo "Running build command: ./build.sh ${{ matrix.build_args }}"
        ./build.sh ${{ matrix.build_args }}
        
        # 打印本次 ccache 命中率
        ccache -s

    # 7. 准备打包产物
    - name: Prepare Artifact
      run: |
        mkdir -p ./output
        for file in ../out/AnyKernel3-picasso/Driftwood-Kernel-*.zip; do
          if [ -f "$file" ]; then
            base=$(basename "$file" .zip)
            cp "$file" "./output/${base}-${{ matrix.ksu_status }}.zip"
          fi
        done

    # 8. 上传编译好的 Zip 卡刷包
    - name: Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Driftwood-Kernel-${{ matrix.ksu_status }}
        path: ./output/Driftwood-Kernel-*.zip
  release:
    name: 发布与通知
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # 🟢 核心修复 1：改为匹配上面正确的任务名 build-kernel
    needs: build-kernel

    steps:
      # --------- 1. 下载内核编译产物 ---------
      - name: 获取构建产物
        uses: actions/download-artifact@v4
        with:
          path: kernel
          # 🟢 核心修复 2：匹配上面 Upload 步骤中实际生成的产物名字前缀
          pattern: Driftwood-Kernel-*
          merge-multiple: true

      # --------- 2. 生成上海时间与时间戳 ---------
      - name: 获取当前时间
        id: time
        run: |
          NOW=$(date +%s)
          TIME_STR=$(TZ='Asia/Shanghai' date -d "@$NOW" +'%Y-%m-%d %H:%M')
          echo "timestamp=$NOW" >> $GITHUB_OUTPUT
          echo "time=$TIME_STR" >> $GITHUB_OUTPUT

      # --------- 3. 创建 GitHub Release 并上传文件 ---------
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: rel-${{ steps.time.outputs.timestamp }}
          name: Kernel Build [${{ steps.time.outputs.time }}]
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            kernel/*

      # --------- 4. 组装美化版消息并发送至 Telegram ---------
      - name: 发送 Telegram 通知
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # 提取并处理提交 ID
          IDS=(${{ join(github.event.commits.*.id, ' ') }})
          MAX=5
          if [ "${#IDS[@]}" -gt "$MAX" ]; then
            COMMIT_IDS_TEXT="$(printf "• %s\n" "${IDS[@]:0:$MAX}"; echo "• ...更多提交请查看对比差异")"
          else
            COMMIT_IDS_TEXT="$(printf "• %s\n" "${IDS[@]}")"
          fi

          DEVICE_INFO="红米K30 5G（picasso）"
          SAFE_MSG=$(echo "$COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\\"/g')

          # 重新设计的 HTML 消息排版
          MSG="<b>New Release！</b>
          ──────────────────────
          <b>适用设备:</b> $DEVICE_INFO
          <b>源码仓库:</b> <code>${{ github.repository }}</code>
          <b>ReSukiSU版本号:</b> <code>${{ needs.build-kernel.outputs.resukisu_ver }}</code>
          <b>编译时间:</b> <code>${{ steps.time.outputs.time }}</code>
          <b>提交描述:</b> <code>$SAFE_MSG</code> 
          <b>工作流详情:</b> <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>点击前往查看</a>
          ──────────────────────
          <i>点击下方按钮即可前往 GitHub Release 获取 Anykernel3 文件</i>"

          # 链接预览与内联按钮配置
          PREVIEW_OPTIONS="{ \
            \"url\": \"${{ steps.release.outputs.url }}\", \
            \"prefer_small_media\": true, \
            \"show_above_text\": true \
          }"

          BUTTONS="{\"inline_keyboard\": [ [ \
            { \"text\": \"下载内核产物\", \"url\": \"${{ steps.release.outputs.url }}\" }, \
            { \"text\": \"对比代码差异\", \"url\": \"${{ github.event.compare }}\" } \
          ] ] }"

          # 发送消息
          curl -LSs -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                -d "chat_id=${{ vars.TELEGRAM_CHAT_ID }}" \
                -d "message_thread_id=${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}" \
                -d "parse_mode=HTML" \
                --data-urlencode "text=$MSG" \
                -d "link_preview_options=$PREVIEW_OPTIONS" \
                -d "reply_markup=$BUTTONS"
