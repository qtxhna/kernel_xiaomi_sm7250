name: Build Driftwood Kernel

on:
  push:
    branches: [ "android-4.19" ] # 匹配你的内核源码分支名
  workflow_dispatch: # 允许手动触发

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取你的 4.19 内核源码
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    # 2. 安装 Ubuntu 编译必要的依赖包
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
          make curl zip unzip libxml2-utils gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    # 3. 独立下载包含 clang-r450784d 的 AOSP 工具链分支
    - name: Setup Specific Android Clang
      run: |
        echo "--------------------------------------------------"
        echo " Cloning Clang 14.0.6 (r450784d) from Android13..."
        echo "--------------------------------------------------"
        
        # 独立拉取包含该 Clang 版本的工具链仓库分支到外层目录
        git clone --depth=1 -b android13-release https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $GITHUB_WORKSPACE/android-clang
        
        # 检查确保目标版本存在
        if [ ! -d "$GITHUB_WORKSPACE/android-clang/clang-r450784d" ]; then
          echo "Error: clang-r450784d not found in this branch!"
          exit 1
        fi
        
        # 将 Clang 的 bin 目录注入到 GitHub Actions 全局 PATH 中
        echo "$GITHUB_WORKSPACE/android-clang/clang-r450784d/bin" >> $GITHUB_PATH

    # 4. 执行 build.sh all 进行编译和打包
    - name: Build Kernel via Script
      run: |
        chmod +x build.sh
        ./build.sh all

    # 5. 将生成的卡刷包复制到工作区，防止路径越界报错
    - name: Prepare Artifact
      run: |
        mkdir -p ./output
        cp ../out/AnyKernel3-picasso/Driftwood-Kernel-*.zip ./output/

    # 6. 上传编译好的 Zip 卡刷包
    - name: Upload Flashable Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Driftwood-Kernel-Flashable
        path: ./output/Driftwood-Kernel-*.zip
